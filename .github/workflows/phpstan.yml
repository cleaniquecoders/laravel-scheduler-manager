name: PHPStan

on:
  push:
    paths: &paths
      - '**.php'
      - 'phpstan.neon.dist'
      - 'testbench.yaml'
      - '.github/workflows/phpstan.yml'
  # Without a pull_request trigger PHPStan never gates a PR, only the push that
  # follows the merge - which is how four errors reached main in #43.
  pull_request:
    paths: *paths

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github
