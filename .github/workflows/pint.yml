name: Pint

on:
  push:
    paths:
      - '**.php'
      - 'pint.json'
      - '.github/workflows/pint.yml'
  pull_request:
    paths:
      - '**.php'
      - 'pint.json'
      - '.github/workflows/pint.yml'

jobs:
  pint:
    name: pint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      # --test makes Pint report violations and exit non-zero instead of
      # rewriting files, so a style violation fails the build.
      - name: Check PHP code style
        run: vendor/bin/pint --test
